[build-system]
build-backend = "scikit_build_core.build"

requires = [ "cython", "numpy", "scikit-build-core" ]

[project]
name = "multispline"
version = "0.9.0"
authors = [
	{name = "Zach Nasipak"}
]
description = "Cubic splines in multiple dimensions"
readme = "README.md"
classifiers = [
	"Programming Language :: Python :: 3",
	'License :: OSI Approved :: MIT License',
	"Natural Language :: English",
	"Programming Language :: C++",
	"Programming Language :: Cython",
]
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
numba = [
  "numba"
]
test = [
  "pytest",
  "pytest-cov"
]
dev = [
  "matplotlib",
  "jupyter",
  "ipython",
  "ipykernel"
]

[tool.cibuildwheel]
# Skip CPython 3.15 until Cython ships stable 3.15 wheels
skip = "cp315-*"

[tool.scikit-build]
sdist.include = [ "cpp/", 'cython/' ]
sdist.exclude = ["tutorial*", ".github/", ".gitignore" ]
wheel.packages = [ "multispline" ]
wheel.exclude = [ "**.cpp", "**.hpp", "**.pyx", "**/CMakeLists.txt"]
